# FHI theme. Copy this file to ~/.config/fhi/themes/ and change it: every key is optional,
# and whatever you leave out follows your system theme. Colors: #rrggbb (or any CSS color).
[theme]
name       = Pastel Pink
scheme     = light             # light | dark | system

# interface
window_bg  = #fff0f5           # window, title bar, menus
window_fg  = #5b3a4a           # text
panel_bg   = #fff8fb           # the file list (leave out for "a hair off window_bg")
accent     = #f28cb1           # selection, switches, focus rings

# terminal
term_bg    = #fff5f8
term_fg    = #6b4457
cursor     = #e75a8f
# the 16 ANSI colors: black red green yellow blue magenta cyan white, then the bright ones
palette    = #6b4457;#e0607e;#7fbf9e;#e8b86d;#7ea6e0;#d58ad0;#6fc3c9;#f3e3ea;#9a7889;#f28ba2;#a3d9b9;#f5d08a;#a3c0ee;#eab0e6;#9ad8dd;#ffffff

# command preview highlights (what a typed command is about to touch / create / move / delete)
touch      = #f5d08a
create     = #a3d9b9
dest       = #a3c0ee
remove     = #f28ba2

radius     = 12                # rounded corners in px (0 = square)
# opacity  = 90                # window see-through, 20..100. Needs a compositor. 100 (or leaving it out) costs nothing
